spring.application.name=spotix-backend
server.port=8080
server.servlet.context-path=/api/v1

# Security and JWT
spotix.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spotix.jwt.expiration-ms=86400000

# CORS
spotix.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Jackson JSON
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.spotix=DEBUG